<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1E45">
<title>Balsam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap">
<style>
:root{--navy:#0F1B4D;--blue:#1E4FD8;--orange:#F26A10;--bg:#F5F7FC;--card:#fff;--ink:#1B2447;--mut:#667090;--line:#E6EAF3;--tint:#EAF0FF;--ok:#15803D;--okbg:#E8F6EC;--warn:#D95A08;--warnbg:#FFF0E5;--bad:#C93B32;--badbg:#FDE8E6;--out:#DDE2EE}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--out);color:var(--ink);font-size:14px;line-height:1.45}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:500px){#app{height:min(860px,calc(100% - 32px));margin-top:16px;border-radius:28px;box-shadow:0 24px 60px rgba(8,18,50,.25);padding-top:0}}
.bar{display:flex;align-items:center;gap:12px;padding:14px 20px 10px}
.bar h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.3px;flex:1}
.bar .back{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;border:1px solid var(--line)}
.main{flex:1;overflow-y:auto;padding:2px 20px 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.main::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}.sheet{scrollbar-width:none}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mut);border-radius:12px}
.tabs button.on{color:var(--blue)}
.tabs button.on svg{stroke-width:2.3}
.tabs svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 12px rgba(15,27,77,.06);padding:13px 14px;margin-bottom:9px}
.hero{background:var(--navy);color:#fff;border:0;display:flex;gap:16px;align-items:center}
.hero .mut{color:#B5C2E6}
.mut{color:var(--mut);font-size:13px}
h2{font-size:15px;font-weight:700;margin:12px 2px 8px}
h3{font-size:15px;font-weight:700;margin:0}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ico{width:40px;height:40px;border-radius:12px;background:var(--tint);color:var(--blue);display:grid;place-items:center;flex:none}
.ico.o{background:var(--warnbg);color:var(--orange)}.ico.g{background:var(--okbg);color:var(--ok)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--tint);color:var(--blue);white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--blue);color:#fff;font-weight:700;text-align:center}
.btn.sec{background:var(--tint);color:var(--blue)}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:11px}
.list .item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .item:last-child{border:0}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--blue);color:#fff}
.bar-t{height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.bar-t i{display:block;height:100%;background:var(--blue);border-radius:9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:var(--tint);color:var(--blue);padding:6px 12px;border-radius:99px;font-weight:600;font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stats b{display:block;font-size:20px;font-weight:800}
.alert{display:flex;gap:12px;align-items:center;background:var(--warnbg);border-radius:18px;padding:14px;margin-bottom:12px}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.bell{position:relative;width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.bell u{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--orange);color:#fff;font:700 10px/18px Inter,sans-serif;text-align:center;text-decoration:none}
.sheet-bg{position:absolute;inset:0;background:rgba(8,16,40,.5);display:flex;align-items:flex-end;z-index:9}
.sheet{width:100%;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:80%;overflow:auto;animation:up .22s ease-out}
.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-bottom:5px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--navy);color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;z-index:20;text-align:center}
.login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px;background:var(--navy);color:#fff}
.login .logo{width:60px;height:60px;border-radius:18px;background:var(--blue);display:grid;place-items:center;font-size:30px;font-weight:800;margin-bottom:22px}
.login h1{font-size:32px;margin:0 0 6px;letter-spacing:-.5px}
.login .field span{color:#B5C2E6}.login .field input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.unread{border-left:4px solid var(--orange)}#app{padding-top:0!important}.bar{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:3px solid var(--orange);border-radius:0 0 22px 22px;margin-bottom:12px}.bar h1{color:#fff;font-size:20px;line-height:1.2}.bar .mut{color:#B5C2E6;font-size:12.5px}.bar h3{color:#fff}.bar .back,.bar .bell{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}.bar .avatar{background:linear-gradient(135deg,#7C3AED,#1E4FD8 55%,#22B8CF)}.bar .btn{background:var(--orange);color:#fff}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cg i{aspect-ratio:1}.cg s{font-size:11px;color:var(--mut);font-weight:600;text-decoration:none}.cd{display:grid;place-items:center;aspect-ratio:1;border-radius:10px;font-size:12.5px;font-weight:600;color:var(--mut);background:var(--bg)}.cd.P{background:var(--okbg);color:var(--ok)}.cd.A{background:var(--badbg);color:var(--bad)}.cd.L{background:var(--warnbg);color:var(--warn)}.cd.td{outline:2px solid var(--blue)}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.field select{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:inherit;color:inherit}h1,h2,h3,.big,.avatar,.stats b{font-family:'Poppins','Inter',sans-serif}.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.kv b{overflow-wrap:anywhere;font-size:13px}.login .logo{background:linear-gradient(135deg,#7C3AED,#1E4FD8 55%,#22B8CF)}
</style>
</head>
